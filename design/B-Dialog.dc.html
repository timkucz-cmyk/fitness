<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>B – Dialog Test eintragen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3FD5E8}a:hover{color:#8BE7F2}
</style>
</helmet>
<div style="width: 390px; height: 1160px; box-sizing: border-box; background: #05080B; color: #E6EDF3; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; padding-top: 64px">
  <form role="dialog" aria-labelledby="dlgT" style="margin: 0; background: {{sheetBg}}; border: 1px solid #2A3A48; border-bottom: 0; border-radius: 18px 18px 0 0; padding: 10px 16px 28px; display: flex; flex-direction: column; gap: 14px; box-shadow: {{sheetShadow}}">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #3A4B5A"></span>
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <small style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: {{accent}}; letter-spacing: 0.08em">BLOCK 2 · WOCHE 6</small>
        <h2 id="dlgT" style="margin: 0; font-size: 22px; font-weight: 600">Re-Test eintragen</h2>
      </div>
      <button type="button" aria-label="Schließen" style="appearance: none; border: 1px solid #3A4B5A; border-radius: 8px; background: transparent; width: 44px; height: 44px; font: inherit; font-size: 20px; color: #E6EDF3; cursor: pointer">×</button>
    </div>
    <p style="margin: 0; font-size: 13px; color: #B7C3CE">Nach dem Aufwärmen, immer zur gleichen Tageszeit. Leere Felder werden übersprungen.</p>

    <sc-for list="{{tests}}" as="t" hint-placeholder-count="6">
      <div style="display: grid; grid-template-columns: 1fr 108px; gap: 10px; align-items: center; border-top: 1px solid #1F2B36; padding-top: 12px">
        <label for="{{t.id}}" style="display: flex; flex-direction: column; gap: 3px">
          <span style="font-size: 14px; font-weight: 600">{{t.label}}<sc-if value="{{t.optional}}" hint-placeholder-val="{{ false }}"> <span style="font-weight: 400; color: #8B9AA8">· optional</span></sc-if></span>
          <small style="font-size: 12px; color: #8B9AA8; line-height: 1.35">{{t.how}}</small>
        </label>
        <span style="display: flex; align-items: center; border: 1px solid #3A4B5A; border-radius: 6px; background: #0A0F14; min-height: 48px; padding-right: 10px">
          <input id="{{t.id}}" inputmode="decimal" placeholder="{{t.last}}" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #E6EDF3; font-family: 'IBM Plex Mono', monospace; font-size: 17px; padding: 0 10px; min-height: 46px">
          <small style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8B9AA8">{{t.unit}}</small>
        </span>
      </div>
    </sc-for>
    <label for="dStage" style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #8B9AA8; border-top: 1px solid #1F2B36; padding-top: 12px">LIEGESTÜTZ-STUFE
      <select id="dStage" style="min-height: 48px; border-radius: 6px; border: 1px solid #3A4B5A; background: #0A0F14; color: #E6EDF3; font: inherit; font-size: 15px; padding: 0 10px; color-scheme: dark"><option>3 · Liegestütz an der Sofakante</option></select>
    </label>
    <p style="margin: 0; font-size: 12px; color: #8B9AA8">Grau im Feld: Wert vom letzten Test.</p>
    <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px">
      <button type="button" style="appearance: none; border: 1px solid #3A4B5A; border-radius: 10px; background: transparent; color: #B7C3CE; font: inherit; font-weight: 600; min-height: 56px; cursor: pointer">Abbrechen</button>
      <button type="submit" style="appearance: none; border: 0; border-radius: 10px; background: {{btnBg}}; box-shadow: {{btnShadow}}; color: #04161A; font: inherit; font-size: 17px; font-weight: 700; min-height: 56px; cursor: pointer">Speichern</button>
    </div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3FD5E8","options":["#3FD5E8","#C6F432","#FFB547","#A18CFF"],"section":"Farbe"},"verlauf":{"editor":"range","default":45,"min":0,"max":100,"step":5,"unit":"%","section":"Farbe"},"glow":{"editor":"boolean","default":true,"section":"Farbe"},"$preview":{"width":390,"height":1160}}'>
class Component extends DCLogic {
  rgb(h) { const n = parseInt(h.replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  rgba(h, a) { const c = this.rgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(3) + ')'; }
  mix(h, t, f) { const a = this.rgb(h), b = this.rgb(t); const c = a.map((x, i) => Math.round(x + (b[i] - x) * f)); return '#' + c.map(x => x.toString(16).padStart(2, '0')).join(''); }
  renderVals() {
    const p = this.props, a = p.accent ?? '#3FD5E8', v = (p.verlauf ?? 45) / 100, glow = p.glow ?? true;
    const tests = [
      { id: 't1', label: 'Liegestütze max.', unit: 'WDH.', last: '11', optional: false, how: 'Höchste Stufe, die du sauber schaffst.' },
      { id: 't2', label: 'Tisch-Rudern gestreckt', unit: 'WDH.', last: '7', optional: false, how: 'Fußposition wie beim ersten Test.' },
      { id: 't3', label: 'Hängen an der Stange', unit: 'S', last: '–', optional: true, how: 'Leer lassen, solange keine Stange da ist.' },
      { id: 't4', label: 'Kniebeugen in 60 s', unit: 'WDH.', last: '29', optional: false, how: 'Volle Tiefe, Fersen am Boden.' },
      { id: 't5', label: 'Unterarmstütz', unit: 'S', last: '58', optional: false, how: 'Abbruch, sobald ein Hohlkreuz entsteht.' },
      { id: 't6', label: 'Finger-Boden-Abstand', unit: 'CM', last: '12', optional: false, how: 'Berühren = 0, darüber hinaus negativ.' }
    ];
    return {
      accent: a, tests,
      sheetBg: 'linear-gradient(180deg, ' + this.mix('#121A22', a, 0.08 * v) + ' 0%, #0F161C 40%)',
      sheetShadow: glow ? '0 -20px 60px ' + this.rgba(a, 0.12) : 'none',
      btnBg: 'linear-gradient(120deg, ' + a + ' 0%, ' + this.mix(a, '#FFFFFF', 0.4 * v) + ' 100%)',
      btnShadow: glow ? '0 10px 30px ' + this.rgba(a, 0.35) : 'none'
    };
  }
}
</script>
</body>
</html>
