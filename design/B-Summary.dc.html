<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>B – Training Zusammenfassung</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3FD5E8}a:hover{color:#8BE7F2}
</style>
</helmet>
<div style="width: 390px; height: 980px; box-sizing: border-box; background: {{rootBg}}; color: #E6EDF3; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 32px 16px 28px; gap: 14px">
  <section style="display: flex; flex-direction: column; gap: 8px; padding: 0 4px">
    <small style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8B9AA8; letter-spacing: 0.1em">EINHEIT ABGESCHLOSSEN · 21:40</small>
    <h1 style="margin: 0; font-size: 36px; line-height: 1.05; font-weight: 600; color: {{accent}}; text-shadow: {{textGlow}}">2× Stufe hoch.</h1>
    <p style="margin: 0; font-size: 15px; color: #B7C3CE">Zählt fürs Wochenziel.</p>
  </section>

  <section style="background: {{cardBg}}; border: 1px solid #1F2B36; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 14px; font-weight: 600">Woche erfüllt</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: {{accent}}">3/3</span></div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
      <span style="height: 8px; border-radius: 3px; background: {{segBg}}"></span>
      <span style="height: 8px; border-radius: 3px; background: {{segBg}}"></span>
      <span style="height: 8px; border-radius: 3px; background: {{segNew}}; box-shadow: {{segShadow}}"></span>
    </div>
    <small style="font-size: 12px; color: #8B9AA8">Alles Weitere ist Bonus.</small>
  </section>

  <section style="background: {{cardBg}}; border: 1px solid #1F2B36; border-radius: 10px; padding: 4px 16px; display: flex; flex-direction: column">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <div style="display: grid; grid-template-columns: 1fr 104px; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid {{r.line}}">
        <div style="display: flex; flex-direction: column; gap: 3px">
          <span style="font-size: 14px"><b>{{r.name}}</b> <span style="color: #8B9AA8">· {{r.ex}}</span></span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px">{{r.vals}}</span>
          <small style="font-size: 12px; color: {{r.whyColor}}">{{r.icon}} {{r.why}}</small>
        </div>
        <label style="display: flex; flex-direction: column; gap: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #8B9AA8">NÄCHSTE
          <select aria-label="{{r.aria}}" style="min-height: 44px; border-radius: 6px; border: 1px solid {{r.selBorder}}; background: #0A0F14; color: #E6EDF3; font-family: 'IBM Plex Mono', monospace; font-size: 14px; padding: 0 8px; color-scheme: dark; box-shadow: {{r.selShadow}}"><option>{{r.next}}</option></select>
        </label>
      </div>
    </sc-for>
  </section>

  <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border: 1px solid #3A4B5A; border-radius: 10px; padding: 0 14px; font-size: 15px; cursor: pointer"><input type="checkbox" checked style="width: 22px; height: 22px; accent-color: {{accent}}; margin: 0">Gemeinsam trainiert</label>
  <label for="sNote" style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #8B9AA8">NOTIZ (OPTIONAL)<input id="sNote" maxlength="140" placeholder="z. B. Schulter etwas fest" style="min-height: 48px; border-radius: 8px; border: 1px solid #3A4B5A; background: #0A0F14; color: #E6EDF3; font: inherit; font-size: 15px; padding: 0 12px; box-sizing: border-box; width: 100%"></label>

  <div style="margin-top: auto; display: grid; grid-template-columns: 1fr 2fr; gap: 10px">
    <button type="button" style="appearance: none; border: 1px solid #3A4B5A; border-radius: 10px; background: transparent; color: #B7C3CE; font: inherit; font-weight: 600; min-height: 60px; cursor: pointer">Verwerfen</button>
    <button type="button" style="appearance: none; border: 0; border-radius: 10px; background: {{btnBg}}; box-shadow: {{btnShadow}}; color: #04161A; font: inherit; font-size: 18px; font-weight: 700; min-height: 60px; cursor: pointer">Speichern</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3FD5E8","options":["#3FD5E8","#C6F432","#FFB547","#A18CFF"],"section":"Farbe"},"verlauf":{"editor":"range","default":45,"min":0,"max":100,"step":5,"unit":"%","section":"Farbe"},"glow":{"editor":"boolean","default":true,"section":"Farbe"},"$preview":{"width":390,"height":980}}'>
class Component extends DCLogic {
  rgb(h) { const n = parseInt(h.replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  rgba(h, a) { const c = this.rgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(3) + ')'; }
  mix(h, t, f) { const a = this.rgb(h), b = this.rgb(t); const c = a.map((x, i) => Math.round(x + (b[i] - x) * f)); return '#' + c.map(x => x.toString(16).padStart(2, '0')).join(''); }
  renderVals() {
    const p = this.props, a = p.accent ?? '#3FD5E8', v = (p.verlauf ?? 45) / 100, glow = p.glow ?? true;
    const R = [
      ['Drücken', 'Sofakante', '12 / 12 Wdh.', 'Alle Sätze am oberen Ende → Stufe 4', 1, 'S4'],
      ['Beine', 'Kniebeuge frei', '12 / 12 Wdh.', 'Alle Sätze am oberen Ende → Stufe 3', 1, 'S3'],
      ['Ziehen', 'Tisch-Rudern', '9 / 8 Wdh.', 'Im Zielbereich – Stufe bleibt', 0, 'S1'],
      ['Rumpf', 'Unterarmstütz', '18 / 15 s', 'Unter dem Mindestwert → Stufe 1', -1, 'S1']
    ];
    const rows = R.map(([name, ex, vals, why, d, next], i) => ({
      name, ex, vals, why, next,
      aria: 'Nächste Stufe ' + name,
      icon: d > 0 ? '▲' : d < 0 ? '▼' : '■',
      whyColor: d > 0 ? '#6FDBA0' : d < 0 ? '#FF8F8F' : '#8B9AA8',
      selBorder: d > 0 ? a : '#3A4B5A',
      selShadow: d > 0 && glow ? '0 0 10px ' + this.rgba(a, 0.35) : 'none',
      line: i === R.length - 1 ? 'transparent' : '#1F2B36'
    }));
    return {
      accent: a, rows,
      rootBg: 'radial-gradient(130% 34% at 50% 0%, ' + this.rgba(a, 0.3 * v) + ', transparent 70%), radial-gradient(80% 25% at 100% 70%, ' + this.rgba('#7B6CF6', 0.14 * v) + ', transparent 70%), #0A0F14',
      cardBg: 'linear-gradient(160deg, ' + this.rgba(a, 0.09 * v) + ' 0%, #121A22 42%, #0F161C 100%)',
      segBg: this.mix(a, '#0A0F14', 0.35),
      segNew: 'linear-gradient(90deg, ' + this.mix(a, '#0A0F14', 0.3 * v) + ', ' + this.mix(a, '#FFFFFF', 0.25) + ')',
      segShadow: glow ? '0 0 12px ' + this.rgba(a, 0.6) : 'none',
      btnBg: 'linear-gradient(120deg, ' + a + ' 0%, ' + this.mix(a, '#FFFFFF', 0.4 * v) + ' 100%)',
      btnShadow: glow ? '0 10px 30px ' + this.rgba(a, 0.35) : 'none',
      textGlow: glow ? '0 0 26px ' + this.rgba(a, 0.5) : 'none'
    };
  }
}
</script>
</body>
</html>
